<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사전등록 | Bread Festival</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body class="register-page"><header class="header"><a class="brand" href="index.html">🍞 빵친구 <span>FESTIVAL</span></a><a class="nav-cta" href="index.html">← 메인으로</a></header><main class="register-wrap"><div class="register-intro"><span class="kicker">PRE-REGISTRATION</span><h1>다양한 빵 친구들과<br><em>만날 준비 됐나요?</em></h1><p>아래 내용을 입력하면 시연용 등록 완료 화면이 표시됩니다.<br>실제 개인정보 전송은 사실 이루어지지 않는답니다.</p><img src="assets/bread-friends.png" alt="귀여운 빵 캐릭터 일러스트"/></div><form id="registrationForm" class="register-form"><h2>사전등록 신청</h2><p class="note">* 표시는 필수 입력 항목은 아니고 하고싶으면 하시면 됩니다.</p><label for="guestName">이름 *</label><input id="guestName" name="guestName" required maxlength="30" placeholder="이름을 입력해주세요"><label for="guestEmail">이메일 *</label><input id="guestEmail" name="guestEmail" type="email" required placeholder="example@email.com"><label for="visitDate">방문 예정일 *</label><select id="visitDate" name="visitDate" required><option value="">날짜를 선택해주세요</option><option>11월 21일 (토)</option><option>11월 22일 (일)</option><option>양일 모두</option></select><label for="guestCount">방문 인원 *</label><select id="guestCount" name="guestCount" required><option value="">인원을 선택해주세요</option><option>1명</option><option>2명</option><option>3명</option><option>4명 이상</option></select><label class="agree"><input type="checkbox" required> <span>시연용 신청 정보 확인에 동의합니다. (사실 정보는 저장되지 않습니다.) *</span></label><button class="btn primary submit" type="submit">사전등록 완료하는 척하기 →</button><div id="formResult" class="form-result" role="status" aria-live="polite" hidden></div></form></main><footer><strong>🍞 빵친구 FESTIVAL</strong><p>포트폴리오 시연용 사이트일 뿐 · 실제 접수 아닙니다. 빵 친구 페스티벌은 허상입니다.</p></footer></body></html>
